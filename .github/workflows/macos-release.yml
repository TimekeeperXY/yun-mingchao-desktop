name: Build macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }} --publish never
      - name: Create SHA-256 checksum
        run: |
          cd mac-dist
          for file in *.dmg; do
            shasum -a 256 "$file" > "$file.sha256"
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            mac-dist/*.dmg
            mac-dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish DMGs to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          ## macOS 客户端

          - 新增 Intel（x64）与 Apple Silicon（arm64）DMG 安装包。
          - 新增 macOS 系统菜单，支持 Command+C/V、Command+Q 和 Control+Command+F 全屏。
          - 保留登录兼容性、鼠标锁定及 Esc 不退出窗口全屏的修复。

          需要 macOS 13 或更新版本。下载对应芯片的 DMG，打开后将应用拖入 Applications。
          当前使用临时签名（ad-hoc），尚未进行 Apple Developer ID 签名和公证，macOS 可能提示无法验证开发者。
          Windows 安装包请使用 v1.0.4 Release。本项目是非官方桌面封装。
          NOTES
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "云·鸣潮 $TAG · macOS" --notes-file release-notes.md
          fi
          gh release upload "$TAG" artifacts/*.dmg artifacts/*.sha256 --clobber
